spring:
  application:
    name: orion-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://db.fdjrgtbenuigzobodjvb.supabase.co:5432/postgres
    username: postgres
    password: Anshikavaish
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:7687
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:orion_dev_pw}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:orion_dev_pw}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}

orion:
  identity:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-min-32-bytes-long-please}
      issuer: orion-platform
      access-token-ttl: 15m
      refresh-token-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: PLATFORM_ADMIN

server:
  port: 8085
